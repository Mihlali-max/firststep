services:
  backend:
    build: ./backend
    container_name: firststep-api
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    container_name: firststep-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
